name: Update casks

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    name: Bump casks and fix style
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --user linuxbrew   # brew refuses to run as root
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone the tap with push access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tap="${owner}/homebrew-tap"
          dest="$(brew --repository)/Library/Taps/${owner}/homebrew-tap"

          mkdir -p "$(dirname "$dest")"
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dest"

          git -C "$dest" config user.name "github-actions[bot]"
          git -C "$dest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          brew trust "$tap"

      - name: Bump outdated casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cd "$(brew --repository)/Library/Taps/${owner}/homebrew-tap"

          for path in Casks/*.rb; do
            [ -e "$path" ] || continue
            cask="$(basename "$path" .rb)"
            echo "::group::${cask}"

            json="$(brew livecheck --json "${owner}/homebrew-tap/${cask}" 2>/dev/null || true)"
            read -r version outdated <<<"$(ruby -rjson -e '
              a = (JSON.parse(STDIN.read) rescue [])
              v = a[0] && a[0]["version"]
              puts "#{v && v["latest"]} #{v && v["outdated"]}"
            ' <<<"$json")"

            if [ -z "$version" ]; then
              echo "No livecheck version (skipped or unsupported); leaving as-is."
            elif [ "$outdated" = "true" ]; then
              echo "Bumping to ${version}"
              brew bump-cask-pr --write-only --no-audit --no-style \
                "${owner}/homebrew-tap/${cask}" --version "$version" \
                || echo "::warning::Failed to bump ${cask}"
            else
              echo "Up to date"
            fi

            echo "::endgroup::"
          done

      - name: Fix style
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cd "$(brew --repository)/Library/Taps/${owner}/homebrew-tap"
          brew style --fix . || echo "::warning::brew style reported remaining offenses"

      # Gate: never push a bump that left the tap unparseable.
      - name: Verify the tap
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cd "$(brew --repository)/Library/Taps/${owner}/homebrew-tap"
          brew readall --aliases --syntax

      - name: Commit and push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cd "$(brew --repository)/Library/Taps/${owner}/homebrew-tap"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git add -A
          git commit -m "chore: auto-update casks and style"
          git push origin "HEAD:${GITHUB_REF_NAME}"
