name: brew test-bot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew:main
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ github.token }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      # This tap ships casks only, so tap syntax and audit checks apply.
      # Exclude token_conflicts from brew audit because cask 'forgit' shares a name with core formula 'forgit'.
      - run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup
          brew style pratyay360/tap
          brew readall --aliases --os=all --arch=all pratyay360/tap
          brew audit --tap=pratyay360/tap --except=installed,token_conflicts

